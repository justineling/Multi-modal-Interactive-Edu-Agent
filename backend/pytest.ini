[pytest]
# 测试统一从 backend/ 目录作为 rootdir 运行：
#   backend/.venv/Scripts/python.exe -m pytest backend/tests -q
testpaths = tests
# 把 backend/ 加进 sys.path，使 `import app.*` 在 rootdir=backend 下可用
pythonpath = .
# asyncio_mode=auto：async def test_* 与 async fixture 无需逐个加 @pytest.mark.asyncio，
# 少一处装饰器就少一处漏写导致的「测试静默不执行」。
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 默认**不跑** `slow` 标记的用例：目前只有 `test_parallel_is_actually_parallel` 一条，
# 它靠墙钟预算（1.12s）断言「并行真的省了时间」，机器上只要同时有别的重活（生成样本 PDF、
# 另开一个 pytest、IDE 索引）就会假红 —— 实测全量连跑时撞到过一次，隔离跑 5/5 通过。
# 那是**测量环境**的问题，不是实现的问题，所以把它移出默认全量，而不是放宽预算
# （预算放到 1.3s 会越过「坏实现纯 sleep 下界 1.15s」，区分力当场消失）。
# 手动跑计时敏感用例：`pytest -m slow tests/test_artifact_parallel.py`（命令行 `-m` 覆盖这里的 `-m`）。
markers =
    slow: 计时敏感，机器有并发负载时会假红；默认不跑，用 `pytest -m slow` 单独跑
addopts = -ra -m "not slow"
filterwarnings =
    ignore::DeprecationWarning
