[pytest]
# 测试统一从 backend/ 目录作为 rootdir 运行：
#   backend/.venv/Scripts/python.exe -m pytest backend/tests -q
testpaths = tests
# 把 backend/ 加进 sys.path，使 `import app.*` 在 rootdir=backend 下可用
pythonpath = .
# asyncio_mode=auto：async def test_* 与 async fixture 无需逐个加 @pytest.mark.asyncio，
# 少一处装饰器就少一处漏写导致的「测试静默不执行」。
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
