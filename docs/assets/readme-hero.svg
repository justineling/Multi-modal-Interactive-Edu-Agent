<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#131821"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <rect width="960" height="520" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="959" height="519" rx="14" fill="none" stroke="#262c36"/>

  <!-- 顶栏 -->
  <rect x="1" y="1" width="958" height="46" rx="13" fill="#161a21"/>
  <rect x="1" y="38" width="958" height="9" fill="#161a21"/>
  <circle cx="26" cy="24" r="5" fill="#3a4150"/>
  <circle cx="44" cy="24" r="5" fill="#3a4150"/>
  <circle cx="62" cy="24" r="5" fill="#3a4150"/>
  <text x="88" y="29" fill="#8b93a1" font-size="13">多模态沉浸式智能助教</text>
  <rect x="828" y="13" width="108" height="22" rx="11" fill="#1d2430" stroke="#2b3444"/>
  <text x="882" y="28" fill="#7d8698" font-size="11" text-anchor="middle">演示模式 · 关</text>
  <line x1="1" y1="47" x2="959" y2="47" stroke="#262c36"/>

  <!-- 左：对话栏 -->
  <rect x="16" y="62" width="356" height="442" rx="10" fill="#12161d" stroke="#222834"/>
  <text x="34" y="88" fill="#6f788a" font-size="11" letter-spacing="1">对话</text>

  <!-- 用户消息 -->
  <rect x="34" y="102" width="300" height="38" rx="8" fill="#1b2130" stroke="#2a3346"/>
  <text x="48" y="126" fill="#c8cedb" font-size="12.5">4.1 Malayan Union 对苏丹的影响</text>

  <!-- 助手消息 -->
  <rect x="34" y="152" width="320" height="118" rx="8" fill="#151a23" stroke="#222834"/>
  <text x="48" y="174" fill="#9aa3b4" font-size="11.5">检索命中 3 个切片 · SYLLABUS_MATCH</text>
  <rect x="48" y="184" width="120" height="18" rx="9" fill="#1a2740" stroke="#2c4470"/>
  <text x="108" y="197" fill="#7fa8f0" font-size="10.5" text-anchor="middle">[p.94]</text>
  <text x="178" y="197" fill="#8b93a1" font-size="10.5">Bab 4.1 · 页码可回溯</text>
  <text x="48" y="222" fill="#b6bece" font-size="12">苏丹保留宗教与习俗事务权限，</text>
  <text x="48" y="242" fill="#b6bece" font-size="12">实权移交英籍顾问 →</text>
  <text x="48" y="262" fill="#6f788a" font-size="11">已生成课件 · 5 页 · 4 种布局</text>

  <!-- 锚点 chip -->
  <rect x="34" y="282" width="232" height="30" rx="8" fill="#1a2233" stroke="#35507d" stroke-dasharray="4 3"/>
  <text x="48" y="302" fill="#8fb4f5" font-size="11">锚点 · 第 2 页 · bullets · p.94</text>

  <!-- 输入框 -->
  <rect x="34" y="452" width="320" height="36" rx="9" fill="#1b2130" stroke="#2a3346"/>
  <text x="48" y="475" fill="#5f6778" font-size="12">继续追问这一页…</text>

  <!-- 右：画布 -->
  <rect x="388" y="62" width="556" height="442" rx="10" fill="#12161d" stroke="#222834"/>

  <!-- 画布工具条 -->
  <rect x="404" y="76" width="52" height="24" rx="6" fill="url(#accent)"/>
  <text x="430" y="92" fill="#ffffff" font-size="11" text-anchor="middle">PPT</text>
  <rect x="462" y="76" width="46" height="24" rx="6" fill="#1b2130" stroke="#2a3346"/>
  <text x="485" y="92" fill="#7d8698" font-size="11" text-anchor="middle">2D</text>
  <rect x="514" y="76" width="46" height="24" rx="6" fill="#1b2130" stroke="#2a3346"/>
  <text x="537" y="92" fill="#7d8698" font-size="11" text-anchor="middle">3D</text>
  <text x="924" y="92" fill="#6f788a" font-size="11" text-anchor="end">生成中 2 / 5</text>

  <!-- 幻灯片 -->
  <rect x="404" y="112" width="524" height="300" rx="10" fill="#171d27" stroke="#2a3346"/>
  <rect x="404" y="112" width="524" height="4" rx="2" fill="url(#accent)"/>
  <text x="432" y="160" fill="#e6e8ec" font-size="24" font-weight="600">Malayan Union 与苏丹主权</text>
  <text x="432" y="184" fill="#7d8698" font-size="12.5">4.1 · p.94</text>

  <circle cx="440" cy="222" r="3.5" fill="#4f8cff"/>
  <text x="456" y="227" fill="#b6bece" font-size="13">苏丹仅保留宗教与习俗事务的权限</text>
  <circle cx="440" cy="252" r="3.5" fill="#4f8cff"/>
  <text x="456" y="257" fill="#b6bece" font-size="13">行政实权移交英籍顾问（Advisor）</text>
  <circle cx="440" cy="282" r="3.5" fill="#4f8cff"/>
  <text x="456" y="287" fill="#b6bece" font-size="13">各州苏丹签署新条约，主权让渡</text>

  <!-- 可点击高亮 -->
  <rect x="424" y="264" width="356" height="32" rx="6" fill="none" stroke="#4f8cff" stroke-opacity="0.55" stroke-dasharray="5 4"/>
  <text x="792" y="285" fill="#4f8cff" font-size="10.5" text-anchor="end">点击追问</text>

  <!-- 翻页 -->
  <text x="432" y="396" fill="#6f788a" font-size="12">◀</text>
  <text x="666" y="396" fill="#9aa3b4" font-size="12" text-anchor="middle">2 / 5</text>
  <text x="900" y="396" fill="#6f788a" font-size="12" text-anchor="end">▶</text>

  <!-- 缩略图条 -->
  <rect x="404" y="428" width="66" height="42" rx="5" fill="#243040" stroke="#3a4a63"/>
  <rect x="476" y="428" width="66" height="42" rx="5" fill="#243040" stroke="#4f8cff"/>
  <rect x="548" y="428" width="66" height="42" rx="5" fill="none" stroke="#2f3a4a" stroke-dasharray="4 4"/>
  <rect x="620" y="428" width="66" height="42" rx="5" fill="none" stroke="#2f3a4a" stroke-dasharray="4 4"/>
  <rect x="692" y="428" width="66" height="42" rx="5" fill="none" stroke="#2f3a4a" stroke-dasharray="4 4"/>
  <text x="790" y="454" fill="#5f6778" font-size="10.5">实线 = 已生成 · 虚线 = 生成中</text>

  <!-- 页脚标注 -->
  <text x="16" y="512" fill="#4d5566" font-size="10.5">界面示意图（非截图）：左栏对话与页码引用，右栏画布，点击任意元素可携带锚点追问</text>
</svg>
